# Corpus definition for RxClarify.
#
# Each entry is a generic name searched against openFDA's `openfda.generic_name`
# field; one prescription label is ingested per entry. The list is deliberately
# weighted toward drugs with dense interaction sections (CYP substrates and
# inhibitors, narrow-therapeutic-index agents, common polypharmacy), so the
# Phase 2 gold-question set has real clinical content to ask about.
#
# Class groupings are metadata for humans — ingestion flattens them.

