[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rxclarify"
version = "0.1.0"
description = "Grounded RAG assistant over public FDA drug labels, with citations and an insufficient-evidence refusal path."
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.8",
    "gradio>=6.24",
    "httpx>=0.27",
    "langchain-aws>=1.7",
    "langchain-core>=1.5",
    "langchain-openai>=1.5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
rxclarify = "rxclarify.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# app.py lives at the repo root, so name it explicitly — `ruff check src tests`
# would otherwise skip the project's main entry point.
extend-include = ["app.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
